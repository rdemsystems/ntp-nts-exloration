# RDEM Systems — fichier de référence, tenu à la main.
#
# Ce fichier ne porte PAS la ligne « généré depuis les mesures RDEM Systems » :
# il ne sera donc jamais régénéré automatiquement. C'est exactement ce que fait un
# opérateur qui reprend son fichier. Prenez-le comme modèle.
#
# Rappel de la règle du dépôt : ce qui est écrit ici est DÉCLARÉ. Ce que nous en
# mesurons vit dans measurements/ et peut le contredire — c'est le but.

operator: "RDEM Systems"
country: "France"
website: "https://ntp.rdem-systems.com/"
contact: "noc@rdem-systems.com"
asn: 206014

servers:
  # --- Serveurs NTS, un par machine, joignables sous leur propre nom -------------
  # Chacun est double-pile v4/v6 et sert du NTS sous son propre certificat.
  # Trois sites franciliens, et plusieurs ASN de transit par site quand c'est
  # possible : l'intérêt n'est pas le nombre de machines, c'est de ne pas toutes
  # les perdre en même temps.
  - hostname: "ntp-1.rdem-systems.com"
    kind: server
    location: "Paris region"
    asn: [206014, 1299]
    nts: true
    access: public
  - hostname: "ntp-2.rdem-systems.com"
    kind: server
    location: "Paris region"
    asn: [206014, 1299, 199275]
    nts: true
    access: public
  - hostname: "ntp-3.rdem-systems.com"
    kind: server
    location: "Paris region"
    asn: [206014, 29075]
    nts: true
    access: public
  - hostname: "ntp-4.rdem-systems.com"
    kind: server
    location: "Paris region"
    asn: [206014, 174, 29075]
    nts: true
    access: public
  - hostname: "ntp-5.rdem-systems.com"
    kind: server
    location: "Paris region"
    asn: [206014, 29075]
    nts: true
    access: public
  - hostname: "ntp-6.rdem-systems.com"
    kind: server
    location: "Paris region"
    asn: [206014, 29075]
    nts: true
    access: public
  - hostname: "ntp-7.rdem-systems.com"
    kind: server
    country: "Germany"        # remplace le `country` de l'opérateur : cette machine
    location: "Frankfurt"     # est à Francfort, et le registre doit la voir ainsi
    asn: [16276]
    nts: true
    access: public
  - hostname: "ntp-8.rdem-systems.com"
    kind: server
    location: "Paris region"
    asn: [206014]
    nts: true
    access: public
  - hostname: "ntp-9.rdem-systems.com"
    kind: server
    location: "Paris region"
    asn: [1299]
    nts: true
    access: public
  - hostname: "ntp-10.rdem-systems.com"
    kind: server
    location: "Paris region"
    asn: [29075]
    nts: true
    access: public
  - hostname: "ntp-11.rdem-systems.com"
    kind: server
    location: "Paris region"
    asn: [199275]
    nts: true
    access: public
  - hostname: "ntp-12.rdem-systems.com"
    kind: server
    location: "France"
    asn: [51167]
    nts: true
    access: public

  # --- Serveur NTP sans NTS ------------------------------------------------------
  # Déclaré `nts: false` volontairement. Une déclaration honnête vaut mieux qu'un
  # `nts: true` que la mesure ira contredire : c'est ce genre d'écart que le
  # registre existe pour montrer.
  - hostname: "ntp-0-hq.rdem-systems.com"
    kind: server
    location: "Pontoise"
    asn: [12322]
    nts: false
    access: public

  # --- Alias et entrées de pool --------------------------------------------------
  # `alias_of` évite le double-comptage : plusieurs noms pour une même machine ne
  # font pas plusieurs serveurs. Les entrées `kind: pool` sont des points d'entrée
  # load-balancés, pas des machines — elles ne se comptent pas non plus.
  - hostname: "ntp-pool.rdem-systems.com"
    kind: pool
    location: "Paris region"
    nts: true
    access: public
    members: "ntp-1 … ntp-6, ntp-8 … ntp-11"
  - hostname: "ntp1.rdem-systems.com"
    kind: alias
    nts: true
    access: public
    alias_of: "ntp-1.rdem-systems.com"
  - hostname: "ntp2.rdem-systems.com"
    kind: alias
    nts: true
    access: public
    alias_of: "ntp-2.rdem-systems.com"
